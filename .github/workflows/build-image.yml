name: Build & Push Container Image

on:
  push:
    # Pre-alpha single-trunk flow: main is the branch, so every push to it builds
    # and publishes an image unless the commit message carries a skip marker.
    # Version tags build too, and additionally carry the semver tag.
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lightweight fast-feedback checks: backend typecheck + web build.
  # Runs on the same triggers as the image build, so main pushes and tags both
  # get it. Intentionally NOT a dependency of `build`, so it never blocks or
  # delays publishing — it is an independent signal. No Postgres is provisioned,
  # so this stays limited to typecheck/build; the full suite against a real
  # Postgres lives in staging.yml, which still only triggers on the `staging`
  # branch and therefore does NOT cover main pushes.
  ci:
    name: Typecheck & Web Build
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skipci]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[no build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

  build:
    # Skip when commit message contains skip markers
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skipci]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[no build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest=false` disables the default `latest=auto` behaviour (which would
          # apply :latest on semver tag pushes only) so the rules below are the whole
          # story: every build published from here is :latest and :<sha>, and a tag
          # build adds its version on top.
          flavor: |
            latest=false
          tags: |
            # Moving pointer at the newest build, from a main push or a tag push alike.
            type=raw,value=latest
            # Immutable, per-commit handle for traceability and pinning. Bare short sha
            # (no `sha-` prefix) so the tag reads as :<sha>.
            type=sha,prefix=,format=short
            # Only on a v* tag push: the release version, e.g. v0.5.0 -> :0.5.0
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
