name: Build & Push Container Image

on:
  push:
    # Pre-alpha single-trunk flow: main is the branch, so every push to it builds
    # and publishes an image unless the commit message carries a skip marker.
    # Version tags build too, and additionally carry the semver tag.
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lightweight fast-feedback checks: backend typecheck + web build.
  # Runs on the same triggers as the image build, so main pushes and tags both
  # get it. Intentionally NOT a dependency of `build`, so it never blocks or
  # delays publishing — it is an independent signal. No Postgres is provisioned,
  # so this stays limited to typecheck/build; the full suite against a real
  # Postgres lives in staging.yml, which still only triggers on the `staging`
  # branch and therefore does NOT cover main pushes.
  ci:
    name: Typecheck & Web Build
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skipci]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[no build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

  build:
    # Skip when commit message contains skip markers
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skipci]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[no build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The same rules as KithLedger and heorth-mcp. A v* tag push publishes
          # its version (v0.10.0 -> :0.10.0, :0.10, :0) and :latest — the default
          # flavor `latest=auto` applies `latest` ONLY on semver tag pushes, so
          # `latest` is a release-only pointer.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # On main push: moving :main tag, plus an immutable :main-<sha> for
            # traceability. Main builds never receive a semver/latest tag.
            type=ref,event=branch
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
