name: tests

# The real test gate: full backend suite against a live Postgres, plus the web
# suite. Build and test only — no deploy/publish (images come from
# build-image.yml). Runs on main, the pre-alpha single-trunk branch, so every
# push is covered rather than only a promotion branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (typecheck + test + build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: heorth
          POSTGRES_PASSWORD: heorthpw
          # Named `_test` because tests/setup.ts refuses any database whose name
          # does not end in _test — it truncates every table between tests.
          POSTGRES_DB: heorth_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U heorth -d heorth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://heorth:heorthpw@localhost:5432/heorth_test
      JWT_SECRET: ci-staging-jwt-secret-at-least-32-chars-long-000
      HOUSEHOLD_NAME: CI Household
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The vitest setup (tests/setup.ts) runs drizzle migrations in beforeAll,
      # so a separate migrate step is not required for the test job. Run it
      # explicitly as well to prove the migration folder applies cleanly.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  web:
    name: web (test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
