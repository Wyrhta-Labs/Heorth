services:
  api:
    build: .
    ports:
      - "${API_PORT:-4000}:3000"
    environment:
      DATABASE_URL: postgres://heorth:${POSTGRES_PASSWORD}@db:5432/heorth
      JWT_SECRET: ${JWT_SECRET}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      API_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: heorth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heorth
    volumes:
      # Postgres 18+ keeps its data under a version subdirectory
      # (/var/lib/postgresql/18/docker), so the volume mounts one level up.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heorth -d heorth"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
