<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Heorth</title>
    <meta name="description" content="Heorth — the household hearth: calendar, meals, shopping list and tasks." />

    <!-- PWA: manifest + icons (served from web/public, both dev and prod-static) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#b5542f" />
    <link rel="icon" type="image/png" href="/pwa-icons/favicon.png" />

    <!-- iOS homescreen install: Safari ignores the manifest for these bits -->
    <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Heorth" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
